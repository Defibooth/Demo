  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f9ff">
  <title>Démo Defibooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --navy: #173a7a;
      --blue: #1d8fe0;
      --sky: #7cc6f5;
      --ink: #1d2a44;
      --coral: #ff7a59;
      --sun: #ffc548;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; background: #eaf4fd; }
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh; min-height: 100dvh;
      color: var(--ink);
      text-align: center;
      display: flex; align-items: center; justify-content: center;
      overflow-x: hidden;
      padding: max(16px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f4f9ff 45%, #e3f0fc 100%);
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle 110px at 10% 20%, rgba(124,198,245,.35), transparent),
        radial-gradient(circle 90px at 92% 14%, rgba(255,197,72,.30), transparent),
        radial-gradient(circle 140px at 88% 72%, rgba(255,122,89,.18), transparent),
        radial-gradient(circle 120px at 8% 84%, rgba(29,143,224,.18), transparent);
    }
    main { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.4dvh, 20px); }
    .logo { width: clamp(150px, 24dvh, 220px); max-width: 64vw; height: auto; }
    h1 {
      font-size: clamp(1.6rem, 4.6dvh, 2.2rem); font-weight: 800; line-height: 1.1; letter-spacing: -.3px;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { font-size: clamp(.82rem, 2dvh, .95rem); font-weight: 600; color: rgba(29,42,68,.6); margin-top: 4px; }

    .camera { width: clamp(64px, 11dvh, 88px); height: auto; filter: drop-shadow(0 8px 14px rgba(23,58,122,.22)); }
    .flash { animation: flash .5s ease-out; }
    @keyframes flash { 0% { filter: drop-shadow(0 0 0 #fff) brightness(1.6); } 100% { filter: drop-shadow(0 8px 14px rgba(23,58,122,.22)); } }

    .progress { display: flex; gap: 8px; justify-content: center; }
    .progress span { width: 10px; height: 10px; border-radius: 50%; background: rgba(23,58,122,.15); transition: background .3s, transform .3s; }
    .progress span.done { background: var(--blue); transform: scale(1.15); }

    .card {
      width: 100%; min-height: clamp(140px, 22dvh, 190px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      padding: 20px; border-radius: 22px;
      background: #fff; border: 2px solid rgba(29,143,224,.25);
      box-shadow: 0 14px 34px rgba(23,58,122,.12);
      font-size: clamp(1.2rem, 3dvh, 1.45rem); font-weight: 700; line-height: 1.3;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card.placeholder { font-weight: 600; color: rgba(29,42,68,.55); font-size: clamp(1rem, 2.4dvh, 1.15rem); }
    .card.stopped { transform: scale(1.02); border-color: var(--blue); box-shadow: 0 0 0 4px rgba(29,143,224,.12), 0 16px 36px rgba(23,58,122,.18); }
    .card .num { font-size: .72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); }
    .card.fin { gap: 8px; }
    .card.fin strong { font-size: clamp(1.1rem, 2.8dvh, 1.3rem); color: var(--navy); }
    .card.fin p { font-size: clamp(.85rem, 2dvh, .95rem); font-weight: 500; color: rgba(29,42,68,.7); }

    button, .cta {
      width: 100%; min-height: 58px; border: 0; border-radius: 999px; cursor: pointer;
      font-family: inherit; font-size: 1.05rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: #fff; background: linear-gradient(135deg, var(--blue), var(--navy));
      box-shadow: 0 10px 22px rgba(23,58,122,.28);
      transition: transform .1s; display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    button.running { background: linear-gradient(135deg, var(--coral), #e2533a); box-shadow: 0 10px 22px rgba(226,83,58,.3); }
    button:active, .cta:active { transform: scale(.97); }
    .cta { background: linear-gradient(135deg, var(--coral), #e2533a); box-shadow: 0 10px 22px rgba(226,83,58,.3); letter-spacing: 1px; font-size: .95rem; }
    .lien { background: none; box-shadow: none; color: var(--navy); min-height: 40px; font-size: .85rem; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>

    <header>
      <h1 id="titre"></h1>
      <p class="sub" id="sousTitre"></p>
    </header>

    <!-- Appareil photo (dessin) -->
    <svg class="camera" id="camera" viewBox="0 0 120 90" aria-hidden="true">
      <rect x="34" y="6" width="34" height="16" rx="5" fill="#173a7a"/>
      <rect x="6" y="16" width="108" height="68" rx="16" fill="url(#g)"/>
      <rect x="86" y="24" width="16" height="9" rx="3" fill="#ffc548"/>
      <circle cx="60" cy="50" r="24" fill="#fff"/>
      <circle cx="60" cy="50" r="18" fill="#173a7a"/>
      <circle cx="60" cy="50" r="10" fill="#7cc6f5"/>
      <circle cx="55" cy="45" r="4" fill="#fff" opacity=".85"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d8fe0"/><stop offset="1" stop-color="#173a7a"/></linearGradient></defs>
    </svg>

    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="card placeholder" id="card" aria-live="polite">Touche le bouton pour lancer</div>
    <button id="btn" type="button">Lancer</button>
    <a class="cta" id="cta" target="_blank" rel="noopener" hidden></a>
    <button class="lien" id="rejouer" type="button" hidden>Rejouer la démo</button>
  </main>

  <script>
    const R = REGLAGES;
    const defis = R.defis.filter(d => typeof d === 'string' && d.trim());
    document.getElementById('titre').textContent = R.titre;
    document.getElementById('sousTitre').textContent = R.sousTitre;
    document.title = 'Démo Defibooth';

    const card = document.getElementById('card');
    const btn = document.getElementById('btn');
    const cta = document.getElementById('cta');
    const rejouer = document.getElementById('rejouer');
    const progress = document.getElementById('progress');
    const camera = document.getElementById('camera');
    cta.textContent = R.finBouton;
    cta.href = R.lienOffres;

    defis.forEach(() => progress.appendChild(document.createElement('span')));

    let pioche, tires, timer = null, enCours = false, affiche = null;

    function melanger(a) {
      a = [...a];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function depart() {
      pioche = melanger(defis); tires = 0; affiche = null;
      [...progress.children].forEach(s => s.classList.remove('done'));
      card.className = 'card placeholder';
      card.textContent = 'Touche le bouton pour lancer';
      btn.textContent = 'Lancer'; btn.hidden = false; btn.classList.remove('running');
      cta.hidden = true; rejouer.hidden = true;
    }

    function defile() {
      let d;
      do { d = defis[Math.floor(Math.random() * defis.length)]; } while (d === affiche && defis.length > 1);
      affiche = d; card.textContent = d;
    }

    const couleurs = ['#1d8fe0', '#173a7a', '#7cc6f5', '#ffc548', '#ff7a59', '#ffffff'];
    function confettis() {
      if (typeof confetti !== 'function') return;
      confetti({ particleCount: 160, spread: 100, startVelocity: 42, origin: { y: .6 }, colors: couleurs });
      confetti({ particleCount: 80, spread: 160, startVelocity: 28, scalar: 1.2, origin: { y: .6 }, colors: couleurs });
    }

    function afficherDefi(d) {
      card.className = 'card stopped';
      card.innerHTML = '';
      const n = document.createElement('span'); n.className = 'num'; n.textContent = 'Défi ' + tires + ' / ' + defis.length;
      const t = document.createElement('span'); t.textContent = d;
      card.append(n, t);
    }

    function finDemo() {
      card.className = 'card fin';
      card.innerHTML = '';
      const s = document.createElement('strong'); s.textContent = R.finTitre;
      const p = document.createElement('p'); p.textContent = R.finTexte;
      card.append(s, p);
      btn.hidden = true; cta.hidden = false; rejouer.hidden = false;
    }

    btn.addEventListener('click', () => {
      if (enCours) {
        clearInterval(timer); enCours = false;
        tires++;
        progress.children[tires - 1].classList.add('done');
        afficherDefi(pioche[tires - 1]);
        camera.classList.remove('flash'); void camera.offsetWidth; camera.classList.add('flash');
        if (navigator.vibrate) navigator.vibrate(60);
        confettis();
        btn.classList.remove('running');
        btn.textContent = tires >= defis.length ? 'Terminer' : 'Défi suivant';
      } else {
        if (tires >= defis.length) { finDemo(); return; }
        enCours = true;
        btn.textContent = 'Stop !'; btn.classList.add('running');
        card.className = 'card';
        timer = setInterval(defile, 60);
      }
    });
    rejouer.addEventListener('click', depart);
    depart();
  </script>
</body>
</html>
